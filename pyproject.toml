[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noise-ceiling"
version = "0.1.0"
description = "Code for the paper Accuracy of Noise Ceiling Estimators for Brain Scores"
authors = [
    { name = "Aude Maier" },
    { name = "Lucas Gruaz" },
    { name = "Martin Schrimpf" },
    { name = "Johanni Brea" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "torch>=1.13",
    "tqdm>=4.60",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["noise_ceiling*"]
