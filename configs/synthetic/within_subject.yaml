name: within_subject
model:
  X: 10
  Y: 10
  K: 1000
  crop: [100, 100]
  T: 100
  n: 12
  shared_fraction: 0.3
  width: 1.0
  sigma: 4
  sigma_spread: 1   # std of log sigma across units
  sigma_origin: 1.0
  within_subject: true
  gaussian_signals: true
sweep:
  n_iter: 10          # dataset regenerations, sets the confidence intervals
  n_rep: 50            # trial subsets per n
estimators:
  run_loop: false
