[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noise-ceiling"
version = "0.1.0"
description = "Bias and convergence of noise ceiling estimators"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "torch>=1.13",
    "tqdm>=4.60",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["noise_ceiling*"]
